# Aimo order playbook — the rails every purchasing agent follows.
# Served at GET /v1/playbook. The gateway's state machine (gateway/playbook/engine.py)
# enforces it: a tool unlocks only when the previous step produced its required
# output; anything else returns 409 step_not_allowed with next_allowed_tools.
# Every call is written to audit_event with this version, so runs replay.
# Change log and plain-language explanation: docs/PLAYBOOK.md.
id: order_playbook
version: "1.1.0"
title: Order playbook — recall first, discover only for gaps
principle: The agent proposes; the gateway checks and decides. Recall the kitchen's own memory before searching.

steps:
  - id: receive
    n: 0
    name: Receive
    does: Log the request and identify buyer, site and agent.
    tools: [start_session]
    output: Session
    guards:
      - id: known_agent
        text: The agent must be registered to the buyer.
      - id: valid_spending_limit
        text: The buyer must have a valid signed spending limit (Intent Mandate). Otherwise stop.
    next: [understand]

  - id: understand
    n: 1
    name: Understand
    does: Extract the Order Brief (what, how much, when, where, constraints, context). Mark each fact found, assumed or missing.
    tools: [parse_request, ask_user]
    output: OrderBrief
    guards:
      - id: one_question
        text: If date, quantity or site is missing, ask ONE question card. Assumptions are shown, never hidden.
    exit: brief.complete == true
    next: [recall]

  - id: recall
    n: 2
    name: Recall first
    does: Search the buyer's own memory in a fixed order and build the idea from there.
    order: [favourites, similar_orders, learned_quantities, standing_orders, leftovers]
    tools: [get_favourites, find_similar_orders, get_learned_quantities, get_standing_orders, get_leftovers, recall]
    exit_tool: recall
    output: RecallResult
    guards:
      - id: recall_before_discover
        text: Discover tools stay locked until recall has run.
      - id: high_confidence_skip
        text: Lines matched with high confidence go straight to Plan; only gaps go to Discover.
    next: [discover, plan]

  - id: discover
    n: 3
    name: Discover only for gaps
    does: For the gaps only, map the need to a product group, search the Valio Aimo assortment and get signed offers.
    tools: [search_products, get_product, request_offers]
    exit_tool: request_offers
    output: Candidates
    guards:
      - id: gaps_only
        text: Locked when recall left no gaps.
      - id: hard_constraints
        text: If no offer meets the hard constraints (allergens, diet), return a safe alternative or a "Can't do this".
    next: [plan]

  - id: plan
    n: 4
    name: Plan
    does: Build the basket. Quantity = guests × learned use + buffer − leftovers, whole packs with least waste, delivery day by shelf life, at most 3 alternatives where there is a real choice.
    tools: [plan_basket]
    output: BasketPlan
    guards:
      - id: traceable
        text: Every line traces to recall or discovery and carries a plain "why".
    next: [check]

  - id: check
    n: 5
    name: Check
    does: The gateway runs the trust checks (signed, fresh offers) and the spending, allergen and delivery rules.
    tools: [check_basket]
    run_by: gateway
    output: Decision
    guards:
      - id: agent_cannot_override
        text: The decision is computed by the gateway; the agent cannot change it.
    next: [present]

  - id: present
    n: 6
    name: Present
    does: Turn the result into cards the chef understands.
    tools: [render_cards]
    output: Cards
    guards:
      - id: plain_language
        text: No banned words; at most 3 numbers and 3 options per card; one main action.
    next: [act, plan, understand]

  - id: act
    n: 7
    name: Act
    does: Place the order, or send the OK request to the right person.
    tools: [place_order, request_approval]
    output: Order
    guards:
      - id: after_check_only
        text: Only after Check, and only what Check allowed (auto / tell me, or after the OK).
      - id: price_locked
        text: Prices are locked to the signed offers; an expired or changed offer stops the order.
    next: [learn]

  - id: learn
    n: 8
    name: Follow up and learn
    does: Delivery updates, "How did it go?" after the event, outcome labels and tips. Feeds Recall next time.
    tools: [record_usage, get_tips]
    output: ProcessRecord
    next: []

# tools usable from any step after receive (read-only, never change state)
always_allowed: [get_session, get_playbook]

# changes the chef can make from the cards; they rewind the session to the named step
rewinds:
  parse_request: understand   # e.g. "now 200 guests"
  plan_basket: plan           # e.g. pick another product, apply a tip, use the safe alternative

decisions:
  auto: {label: "Ready to order", rule_outcome: AUTO}
  tell_me: {label: "Ordered, I'll tell you", rule_outcome: NOTIFY}
  needs_ok: {label: "Needs your OK", rule_outcome: APPROVE}
  blocked: {label: "Can't do this", rule_outcome: BLOCK}

language:
  banned_words: [mandate, policy, "rule id", gtin, jws, score, tier, "need group", "R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11", "R12", "R13", "R14", "V1", "V2", "V3", sku, "vc+jwt", offerid]
  use_instead:
    mandate: your spending limit
    policy: your rules
    score: best match
  max_numbers_per_card: 3
  max_options_per_card: 3

cards:
  understood: {title: "What I understood", action: [Looks right, Change]}
  question: {title: "One question", action: [tap an answer]}
  favourites: {title: "From your favourites", action: [Use this]}
  basket: {title: "Shopping basket", action: [Order, See items]}
  choice: {title: "Product choice", action: [Pick one]}
  needs_ok: {title: "Needs your OK", action: [OK, Not now]}
  cant_do: {title: "Can't do this", action: [Use alternative]}
  delivery: {title: "Delivery", action: [Track]}
  how_did_it_go: {title: "How did it go?", action: [Save]}
  tip: {title: "Tip", action: [Apply, Ignore]}

schemas:
  Session:
    type: object
    required: [sessionId, buyerId, agentId, playbookVersion]
    properties:
      sessionId: {type: string}
      buyerId: {type: string}
      agentId: {type: string}
      playbookVersion: {type: string}
  Fact:
    type: object
    required: [status]
    properties:
      status: {enum: [found, assumed, missing]}
  OrderBrief:
    type: object
    required: [context, what, howMuch, when, site, constraints, complete, missing]
    properties:
      context: {enum: [event, standing, ad_hoc]}
      what: {$ref: "#/schemas/Fact"}
      howMuch: {$ref: "#/schemas/Fact"}
      when: {$ref: "#/schemas/Fact"}
      site: {$ref: "#/schemas/Fact"}
      constraints: {type: object}
      complete: {type: boolean}
      missing: {type: array, items: {type: string}}
  RecallResult:
    type: object
    required: [matched, gaps, sources]
    properties:
      matched:
        type: array
        items:
          type: object
          required: [need, source, confidence]
          properties:
            need: {type: string}
            source: {enum: [favourites, similar_orders, learned_quantities, standing_orders, leftovers]}
            confidence: {enum: [high, medium, low]}
      gaps: {type: array, items: {type: string}}
      sources: {type: array}
  Candidates:
    type: object
    required: [gaps]
    properties:
      gaps:
        type: array
        items:
          type: object
          required: [need, candidates]
          properties:
            need: {type: string}
            candidates: {type: array, maxItems: 6}
  BasketPlan:
    type: object
    required: [lines, total, deliveryDays]
    properties:
      lines:
        type: array
        items:
          type: object
          required: [productId, qty, unit, lineTotal, deliveryDate, why, source]
          properties:
            why: {type: string, minLength: 3}
            source: {enum: [favourites, similar_orders, learned_quantities, standing_orders, leftovers, discover, valio-aimo-seller]}
      total: {type: number}
      deliveryDays: {type: array}
  Decision:
    type: object
    required: [decision, reasons, offersVerified]
    properties:
      decision: {enum: [auto, tell_me, needs_ok, blocked]}
      reasons: {type: array, items: {type: string}}
      offersVerified: {type: boolean}
  Cards:
    type: object
    required: [cards]
    properties:
      cards:
        type: array
        items:
          type: object
          required: [type, title]
          properties:
            options: {type: array, maxItems: 3}
            numbers: {type: array, maxItems: 3}
  Order:
    type: object
    required: [status]
    properties:
      status: {enum: [ordered, waiting_for_ok]}
  ProcessRecord:
    type: object
    required: [processId, labels]

# 1.1.0: one JSON Schema (draft 2020-12) per tool for its input. The gateway validates every call against
# it before the tool runs; a mismatch is 422 bad_input with fix.expected and fix.example. MCP tools are
# generated from these schemas, so the fields are typed parameters, not a JSON string.
inputs:
  start_session:
    type: object
    additionalProperties: false
    properties:
      buyerId: {type: string, description: "Customer account; defaults to the credential's own buyer."}
      agentId: {type: string, description: "Set by the gateway from the credential."}
      channel: {enum: [api, mcp, chat], description: "Set by the gateway: how the agent connects."}
    examples: [{}, {buyerId: BUY-POHJOLA}]
  parse_request:
    type: object
    additionalProperties: false
    properties:
      text: {type: string, minLength: 1, description: "The request in the chef's own words (English or Finnish)."}
      answer:
        type: object
        description: "The answer to the one question ask_user returned."
        additionalProperties: false
        required: [field, value]
        properties:
          field: {type: string, description: "The field the question asked for: when, howMuch or where."}
          value: {description: "The answer, e.g. '2026-11-16' or 1000."}
    oneOf: [{required: [text]}, {required: [answer]}]
    examples: [{text: "I need 1,000 litres of lactose-free milk by Monday."}, {answer: {field: when, value: "2026-11-16"}}]
  ask_user:
    type: object
    additionalProperties: false
    properties: {}
    examples: [{}]
  get_favourites: &noargs
    type: object
    additionalProperties: false
    properties: {}
    examples: [{}]
  find_similar_orders: *noargs
  get_learned_quantities: *noargs
  get_standing_orders: *noargs
  get_leftovers: *noargs
  recall: *noargs
  search_products:
    type: object
    additionalProperties: false
    properties:
      query: {type: string, description: "What to look for, e.g. 'oat drink'."}
      need: {type: string, description: "A gap from recall; used as the query when query is empty."}
      excludeAllergens: {type: array, items: {type: string}, description: "Allergens the product must not contain."}
      diet: {type: array, items: {type: string}, description: "Diet claims the product must have, e.g. vegan."}
      limit: {type: integer, minimum: 1, maximum: 50, description: "How many results (default 10)."}
    examples: [{query: oat drink}, {need: cream, excludeAllergens: [nuts], limit: 5}]
  get_product:
    type: object
    additionalProperties: false
    required: [productId]
    properties:
      productId: {type: string, description: "GTIN or Valio Aimo product id from search_products."}
    examples: [{productId: "06439990001072"}]
  request_offers: *noargs
  plan_basket:
    type: object
    additionalProperties: false
    properties:
      choices: {type: object, additionalProperties: {type: string}, description: "lineId -> productId, for a line with pendingChoices."}
      useAlternative: {type: string, description: "lineId whose safe alternative (from cantDo) to use."}
      acceptTip: {type: string, description: "tipId to apply."}
      ignoreTip: {type: string, description: "tipId to ignore."}
      acceptSuggestion: {type: string, description: "suggestionId from get_suggestions (Valio Aimo seller) to add; re-plans and re-checks."}
    examples: [{}, {choices: {L1: "06439990001072"}}, {acceptTip: TIP-1}]
  check_basket: *noargs
  render_cards:
    type: object
    additionalProperties: false
    properties:
      cards: {type: array, items: {type: object}, description: "Optional own wording; must pass the same plain-language lint."}
    examples: [{}]
  place_order:
    type: object
    additionalProperties: false
    properties:
      offerIds: {type: array, items: {type: string}, minItems: 1, description: "Exactly the offer ids of the checked basket (plan_basket.offers)."}
      idempotencyKey: {type: string, maxLength: 200, description: "Retry-safe: the same key and body return the same order."}
    examples: [{offerIds: [OF-1A2B3C4D]}, {offerIds: [OF-1A2B3C4D], idempotencyKey: order-2026-11-13-01}]
  request_approval:
    type: object
    additionalProperties: false
    properties:
      note: {type: string, description: "Optional note for the approver."}
      idempotencyKey: {type: string, maxLength: 200, description: "Retry-safe: one approval request per key."}
    examples: [{}]
  record_usage:
    type: object
    additionalProperties: false
    properties:
      entries: {type: object, additionalProperties: {enum: [all, some, ran_out]}, description: "need -> how much was used."}
      idempotencyKey: {type: string, maxLength: 200, description: "Retry-safe: the outcome is recorded once per key."}
    examples: [{entries: {lactose-free milk: all}}]
  get_tips:
    type: object
    additionalProperties: false
    properties:
      eventType: {type: string, description: "Optional event type, e.g. gala_dinner."}
    examples: [{}]
  get_session: *noargs
  get_playbook: *noargs
