<title>Aimo Kitchen Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Chat-first ordering for professional kitchens on the Aimo Agent Gateway.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>/* Aimo kitchen assistant — minimal Material 3.
   Layout: Claude-style chat in the centre, recent chats + nav on the left,
   Jira-style detail panel sliding in from the right (bottom sheet on phones).
   Three colours only: turquoise (primary), white (surface), sky blue (secondary). */
:root {
  --bg: #f4f9fa;
  --surface: #ffffff;
  --surface-2: #eaf4f5;
  --surface-3: #dcecee;
  --fg: #0c2629;
  --muted: #4c666a;
  --outline: #d0e2e4;
  --outline-strong: #9fbfc2;
  --primary: #00727c;
  --on-primary: #ffffff;
  --primary-soft: #c8eef1;
  --on-primary-soft: #00363b;
  --sky: #d3edfa;
  --on-sky: #0b3a50;
  --sky-strong: #6cc4ea;
  --warn: #8a5a00;
  --warn-soft: #fbefd6;
  --stop: #9e3a2f;
  --stop-soft: #fbe5e1;
  --state: 0, 114, 124;
  --shadow: 0 1px 2px rgba(12, 38, 41, .06), 0 3px 10px rgba(12, 38, 41, .06);
  --shadow-hi: 0 4px 10px rgba(12, 38, 41, .08), 0 12px 28px rgba(12, 38, 41, .10);
  /* validated categorical palette (dataviz validator: all checks pass; yellow/magenta need labels or table) */
  --ev-1: #0097a7; --ev-2: #eb6834; --ev-3: #2a78d6; --ev-4: #eda100; --ev-5: #e87ba4; --ev-6: #008300; --ev-7: #6250d6; --ev-8: #e34948;
  --seq-1: #d7f1f3; --seq-2: #3fb1bc; --seq-3: #00474d;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 20px;
  --r-pill: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #091416; --surface: #101e21; --surface-2: #162a2e; --surface-3: #1c3439; --fg: #e2f1f2; --muted: #9bb4b7; --outline: #26403f; --outline-strong: #3f6064;
    --primary: #5fd2db; --on-primary: #00363b; --primary-soft: #0e474d; --on-primary-soft: #c6f1f4;
    --sky: #12384a; --on-sky: #cfeaf8; --sky-strong: #5cb8e0;
    --warn: #f1c46b; --warn-soft: #3a2d10; --stop: #f2a196; --stop-soft: #43221d; --state: 95, 210, 219;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-hi: 0 6px 24px rgba(0, 0, 0, .45);
    --ev-1: #1fa6b2; --ev-2: #d95926; --ev-3: #3987e5; --ev-4: #c98500; --ev-5: #d55181; --ev-6: #008300; --ev-7: #9085e9; --ev-8: #e66767;
    --seq-1: #12353a; --seq-2: #1f8f99; --seq-3: #9be7ee; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #091416; --surface: #101e21; --surface-2: #162a2e; --surface-3: #1c3439; --fg: #e2f1f2; --muted: #9bb4b7; --outline: #26403f; --outline-strong: #3f6064;
    --primary: #5fd2db; --on-primary: #00363b; --primary-soft: #0e474d; --on-primary-soft: #c6f1f4;
    --sky: #12384a; --on-sky: #cfeaf8; --sky-strong: #5cb8e0;
    --warn: #f1c46b; --warn-soft: #3a2d10; --stop: #f2a196; --stop-soft: #43221d; --state: 95, 210, 219;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-hi: 0 6px 24px rgba(0, 0, 0, .45);
    --ev-1: #1fa6b2; --ev-2: #d95926; --ev-3: #3987e5; --ev-4: #c98500; --ev-5: #d55181; --ev-6: #008300; --ev-7: #9085e9; --ev-8: #e66767;
    --seq-1: #12353a; --seq-2: #1f8f99; --seq-3: #9be7ee; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky-strong); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }
.app.panel-open { grid-template-columns: 272px minmax(0, 1fr) 420px; }
.side { background: var(--surface); border-right: 1px solid var(--outline); display: flex; flex-direction: column; min-height: 0;
  padding: 18px 14px calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.brand .dot { width: 30px; height: 30px; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 16px; }
.brand small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.new-chat { display: flex; align-items: center; gap: 10px; border: 0; background: var(--primary-soft); color: var(--on-primary-soft);
  border-radius: 16px; padding: 12px 14px; font-weight: 600; }
.nav { display: grid; gap: 2px; margin-top: 8px; }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 10px 12px; border-radius: 14px; text-align: left; font-weight: 500; color: var(--fg); }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--sky); color: var(--on-sky); font-weight: 600; }
.nav .badge { margin-left: auto; background: var(--primary); color: var(--on-primary); border-radius: var(--r-pill); font-size: 13px; padding: 0 8px; font-weight: 700; }
.recent-h { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 18px 12px 6px; font-weight: 600; }
.recent { overflow-y: auto; display: grid; gap: 2px; align-content: start; min-height: 0; flex: 1; }
.recent button { border: 0; background: none; text-align: left; padding: 9px 12px; border-radius: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); font-size: 15px; }
.recent button:hover { background: var(--surface-2); }
.recent button[aria-current="true"] { background: var(--surface-2); font-weight: 600; }
.who { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--outline); background: none; text-align: left; }
.who .av { width: 34px; height: 34px; border-radius: 50%; background: var(--sky); color: var(--on-sky); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.who b { display: block; font-size: 15px; } .who span { font-size: 13px; color: var(--muted); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: none; }
.view { flex: 1; overflow-y: auto; min-height: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.wide { max-width: 1180px; }
.page-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.page-h h1 { font-size: 28px; font-weight: 700; letter-spacing: -.015em; }

/* ---------- chat ---------- */
.thread { display: flex; flex-direction: column; gap: 18px; }
.msg-user { align-self: flex-end; max-width: 85%; background: var(--sky); color: var(--on-sky); padding: 12px 16px; border-radius: 22px 22px 6px 22px; }
.turn { display: grid; gap: 12px; }
.empty { text-align: center; padding: 8vh 0 0; display: grid; gap: 10px; justify-items: center; }
.empty h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.empty p { margin: 0; color: var(--muted); max-width: 44ch; }
.ideas { display: grid; gap: 10px; margin-top: 18px; width: 100%; max-width: 560px; }
.idea { border: 1px solid var(--outline); background: var(--surface); border-radius: 16px; padding: 12px 16px; text-align: left; display: flex; gap: 12px; align-items: center; }
.idea:hover { border-color: var(--primary); }
.idea span { flex: 1; min-width: 0; }
.idea small { display: block; color: var(--muted); font-size: 14px; }

.composer-zone { padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); }
.composer { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--outline); border-radius: 28px; padding: 8px 8px 8px 20px; box-shadow: var(--shadow); }
.composer:focus-within { border-color: var(--primary); }
.composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; padding: 9px 0; max-height: 160px; min-width: 0; line-height: 1.4; }
.ibtn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: none; color: var(--muted); flex: none; }
.ibtn:hover { background: var(--surface-2); color: var(--fg); }
.ibtn.send { background: var(--primary); color: var(--on-primary); }
.ibtn.send:disabled { background: var(--surface-2); color: var(--muted); cursor: default; }
.ibtn.rec { background: var(--stop-soft); color: var(--stop); }
.hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-card); padding: 18px 20px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.card-h .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-soft); color: var(--on-primary-soft); }
.card-h .ic svg { width: 20px; height: 20px; }
.card[data-type="cant_do"] .ic { background: var(--stop-soft); color: var(--stop); }
.card[data-type="needs_ok"] .ic, .card[data-type="question"] .ic { background: var(--warn-soft); color: var(--warn); }
.card[data-type="tip"] .ic, .card[data-type="favourites"] .ic { background: var(--sky); color: var(--on-sky); }
.card-t { font-size: 19px; font-weight: 600; line-height: 1.35; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--outline); background: var(--surface); border-radius: 10px; padding: 5px 12px; font-size: 15px; }
.chip.found { background: var(--primary-soft); border-color: transparent; color: var(--on-primary-soft); }
.chip.assumed { border-style: dashed; color: var(--muted); }
.nums { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.nums div { display: grid; }
.nums b { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.nums span { font-size: 14px; color: var(--muted); }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; border: 1px solid var(--outline); background: var(--surface); border-radius: 16px; padding: 12px 16px; }
.opt:hover:not(:disabled) { border-color: var(--primary); background: var(--surface-2); }
.opt b { font-weight: 600; min-width: 0; }
.opt .tag { justify-self: end; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: var(--r-pill); background: var(--sky); color: var(--on-sky); }
.opt small { color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
.opt.picked { border-color: var(--primary); background: var(--primary-soft); }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.btn { border: 0; border-radius: var(--r-pill); padding: 11px 22px; font-weight: 600; min-height: 46px; background: var(--sky); color: var(--on-sky); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.text { background: none; color: var(--primary); padding-inline: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.done-note { display: inline-flex; align-items: center; gap: 6px; color: var(--primary); font-weight: 600; font-size: 15px; }
.done-note svg { width: 20px; height: 20px; }
.why-link { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 15px; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.why { margin: 0; padding: 12px 16px; background: var(--surface-2); border-radius: 14px; display: grid; gap: 6px; list-style: none; font-size: 15px; color: var(--fg); }
.why li { padding-left: 16px; position: relative; } .why li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.usage { display: grid; gap: 10px; }
.urow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--outline); border-radius: var(--r-pill); overflow: hidden; }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 14px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--outline); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.typing { display: inline-flex; gap: 10px; align-items: center; color: var(--muted); font-size: 15px; padding: 6px 4px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1s infinite ease-in-out; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } * { transition: none !important; } }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border-radius: 18px; padding: 12px; display: grid; gap: 10px; align-content: start; min-height: 180px; }
.col h2 { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; padding: 2px 4px; }
.col h2 span { color: var(--muted); font-weight: 500; }
.ticket { border: 1px solid var(--outline); background: var(--surface); border-radius: 14px; padding: 12px 14px; text-align: left; display: grid; gap: 4px; }
.ticket:hover { border-color: var(--primary); }
.ticket b { font-weight: 600; }
.ticket small { color: var(--muted); font-size: 14px; }
.ticket .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.pill { font-size: 13px; font-weight: 600; border-radius: var(--r-pill); padding: 2px 10px; background: var(--sky); color: var(--on-sky); white-space: nowrap; }
.pill.waiting { background: var(--warn-soft); color: var(--warn); }
.pill.ordered, .pill.delivered { background: var(--primary-soft); color: var(--on-primary-soft); }
.col-empty { color: var(--muted); font-size: 14px; padding: 8px 4px; }
.group-list { display: none; }

/* ---------- insights & settings ---------- */
.statements { display: grid; gap: 14px; }
.statement { display: grid; gap: 4px; padding: 18px 20px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--outline); }
.statement b { font-size: 21px; font-weight: 600; line-height: 1.3; }
.statement span { color: var(--muted); font-size: 15px; }
.statement.good b::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); margin-right: 10px; vertical-align: middle; }
.chart { background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-card); padding: 18px 20px; margin-top: 14px; }
.chart h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 12px var(--font); }
.section { margin-top: 26px; }
.section > h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.list { background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-card); display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 14px 18px; min-width: 0; }
.li + .li { border-top: 1px solid var(--outline); }
.li span { flex: 1; min-width: 0; }
.li small { color: var(--muted); font-size: 14px; display: block; }
.li b.num { font-weight: 600; }
button.li { border: 0; background: none; text-align: left; width: 100%; }
button.li:hover { background: var(--surface-2); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--outline); flex: none; display: grid; place-items: center; }
.radio.on { border-color: var(--primary); } .radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.steps { counter-reset: s; display: grid; }
.steps .li::before { counter-increment: s; content: counter(s, decimal); font-weight: 700; color: var(--on-primary-soft); background: var(--primary-soft); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 14px; }
.seg-wide { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- panel / sheet ---------- */
.panel { background: var(--surface); border-left: 1px solid var(--outline); display: flex; flex-direction: column; min-height: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px 22px; border-bottom: 1px solid var(--outline); }
.panel-h h2 { font-size: 19px; font-weight: 700; flex: 1; min-width: 0; }
.panel-b { overflow-y: auto; padding: 18px 22px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; align-content: start; }
.scrim { display: none; }
.day-h { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--outline); }
.item small { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.src { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: var(--r-pill); background: var(--sky); color: var(--on-sky); margin-left: 6px; vertical-align: 2px; }
.stepper { display: flex; gap: 6px; }
.stepper i { flex: 1; height: 6px; border-radius: 3px; background: var(--outline); }
.stepper i.on { background: var(--primary); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-size: 15px; z-index: 40; max-width: calc(100% - 32px); }
.tabbar { display: none; }

/* ---------- phone ---------- */
@media (max-width: 860px) {
  .app, .app.panel-open { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--outline); background: var(--surface); }
  .topbar b { flex: 1; font-size: 18px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; inset: auto 0 0 0; background: var(--surface); border-top: 1px solid var(--outline); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); z-index: 20; }
  .tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; position: relative; }
  .tabbar button span.pip { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  .tabbar button[aria-current="page"] { color: var(--fg); }
  .tabbar button[aria-current="page"] span.pip { background: var(--sky); color: var(--on-sky); }
  .tabbar .badge { position: absolute; top: 0; left: 55%; background: var(--primary); color: var(--on-primary); border-radius: 9px; font-size: 11px; padding: 0 6px; }
  .wrap { padding-block: 18px 18px; }
  .composer-zone { padding-bottom: 10px; }
  .card { padding: 16px; border-radius: 18px; }
  .card-t { font-size: 18px; }
  .nums b { font-size: 23px; }
  .board { display: none; }
  .group-list { display: grid; gap: 22px; }
  .group-list h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; }
  .group-list .tickets { display: grid; gap: 10px; }
  .panel { position: fixed; inset: auto 0 0 0; max-height: 86%; border-radius: 26px 26px 0 0; border-left: 0; z-index: 31; box-shadow: 0 -8px 30px rgba(0, 0, 0, .18); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .panel::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--outline); margin: 10px auto 0; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(5, 20, 22, .4); z-index: 30; }
  .urow { grid-template-columns: 1fr; }

const dl = (d) => { if (!d) return ''; const x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + x.getDate() + '.' + (x.getMonth() + 1) + '.'; };

function mode() {

}

async function load() {
  const { API, S } = A();
  O.loading = true;

    O.hist = await API.history(S.buyerId, { page: O.page, size: O.size, q: O.q, siteId: O.site, sort: O.sort, dir: O.dir });

  } catch (e) { O.hist = { orders: [], total: 0, page: 1, size: O.size }; }
  O.loading = false;
  if (S.view === 'orders') A().renderView();
}

function reset() { O.hist = null; O.sites = null; O.site = ''; O.q = ''; O.page = 1; O.quick = {}; }

// one shape for live tickets and past orders
function liveItems() {
  return A().boardItems().map((i) => Object.assign({}, i, { live: true }));
}
function histItems() {
  return ((O.hist && O.hist.orders) || []).map((o) => ({
    id: o.id, key: o.key, live: false, status: 'done', statusLabel: 'Done', type: o.type === 'event' ? 'event' : 'order',
    title: o.event || 'Regular delivery', subtitle: `${o.lines} products · ${o.site}`, site: o.site, siteId: o.siteId,
    due: o.date, total: o.total, totalLabel: eur(o.total), eventColor: o.event ? colorOf(o.event) : null, eventName: o.event,
    outcome: o.outcome, onTime: o.onTime,
  }));
}

function filtered(includeHistory) {
  const now = new Date('2026-11-13T12:00:00');
  const week = new Date(now); week.setDate(now.getDate() + 7);
  let items = liveItems();
  if (includeHistory) items = items.concat(histItems());
  const q = O.q.toLowerCase();
  return items.filter((i) => {
    if (q && ![i.key, i.title, i.subtitle, i.site, i.eventName].some((x) => String(x || '').toLowerCase().includes(q))) return false;
    if (O.site && i.siteId && i.siteId !== O.site) return false;
    if (O.quick.needsOk && i.status !== 'waiting') return false;
    if (O.quick.events && i.type !== 'event') return false;
    if (O.quick.week && !(i.due && new Date(i.due + 'T12:00:00') <= week && new Date(i.due + 'T12:00:00') >= now)) return false;
    if (O.event && i.eventName !== O.event) return false;
    return true;
  });
}

function label(i) {
  return i.eventColor ? `<span class="ev-label" style="--ev: var(--ev-${i.eventColor})">${A().esc(i.eventName.length > 22 ? i.eventName.slice(0, 21) + '…' : i.eventName)}</span>` : '<span class="ev-label plain">Regular</span>';
}

function card(i) {
  const { esc } = A();
  return `<button class="tk ${i.eventColor ? 'has-ev' : ''}" style="${i.eventColor ? `--ev: var(--ev-${i.eventColor})` : ''}" data-open="${esc(i.id)}" data-live="${i.live ? 1 : 0}">
    <span class="tk-top"><span class="tk-key">${esc(i.key)}</span>${label(i)}</span>
    <b>${esc(i.title)}</b><small>${esc(i.subtitle)}</small>
    <span class="tk-foot"><span class="tk-due">${i.due ? A().ic('clip') + esc(dl(i.due)) : ''}</span><span class="num">${esc(i.totalLabel || '')}</span></span></button>`;
}

function lanes(items) {
  if (O.group === 'status') return [{ id: '', label: '', items }];
  const key = O.group === 'event' ? (i) => i.eventName || 'Regular deliveries' : (i) => i.site || 'Kitchen';
  const map = new Map();
  for (const i of items) { const k = key(i); if (!map.has(k)) map.set(k, []); map.get(k).push(i); }
  return [...map.entries()].map(([k, v]) => ({ id: k, label: k, items: v, color: O.group === 'event' && v[0].eventColor }));
}

function boardHtml(items) {
  const { esc } = A();
  return lanes(items).map((ln) => `${ln.label ? `<div class="lane-h">${ln.color ? `<i class="dot" style="background: var(--ev-${ln.color})"></i>` : ''}${esc(ln.label)} <span class="muted">${ln.items.length}</span></div>` : ''}
    <div class="board5">${STATUSES.map(([s, l]) => {
      const cs = ln.items.filter((i) => i.status === s);
      const shown = s === 'done' ? cs.slice(0, 12) : cs;
      return `<section class="col5" aria-label="${l}"><h2>${l}<span>${cs.length}</span></h2>${shown.map(card).join('') || '<div class="col-empty">Nothing here</div>'}${cs.length > shown.length ? `<button class="btn text" data-omode="list">See all ${cs.length}</button>` : ''}</section>`;
    }).join('')}</div>`).join('');
}

function th(id, labelText) {

}

function listHtml(items) {
  const { esc } = A();
  const rows = (arr) => arr.map((i) => `<tr data-open="${esc(i.id)}" data-live="${i.live ? 1 : 0}" tabindex="0">
      <td class="k"><span class="stripe" style="background:${i.eventColor ? `var(--ev-${i.eventColor})` : 'var(--outline)'}"></span>${esc(i.key)}</td>
      <td><b>${esc(i.title)}</b><small>${esc(i.subtitle)}</small></td><td>${label(i)}</td><td>${esc(i.site || '')}</td>
      <td><span class="pill ${i.status}">${esc(i.statusLabel)}</span></td><td class="num">${esc(dl(i.due))}</td><td class="num r">${esc(i.totalLabel || '')}</td></tr>`).join('');
  const body = lanes(items).map((ln) => (ln.label ? `<tr class="grp"><td colspan="7">${ln.color ? `<i class="dot" style="background: var(--ev-${ln.color})"></i>` : ''}${esc(ln.label)} <span class="muted">${ln.items.length}</span></td></tr>` : '') + rows(ln.items)).join('');
  const total = (O.hist && O.hist.total) || 0;
  const from = (O.page - 1) * O.size + 1, to = Math.min(total, O.page * O.size);
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${th('key', 'Key')}<th scope="col">Summary</th><th scope="col">Event</th>${th('site', 'Kitchen')}<th scope="col">Status</th>${th('date', 'Due')}${th('total', 'Total')}</tr></thead><tbody>${body || '<tr><td colspan="7" class="muted">No orders match.</td></tr>'}</tbody></table></div>

      <button class="ibtn" data-opage="1" aria-label="Next page" ${to >= total ? 'disabled' : ''}>${A().ic('chevr')}</button></div>`;
}

function view() {

  return `<div class="wrap wide"><div class="page-h"><h1>Orders</h1><span class="muted">${esc(KITCHENS[S.buyerId].name)}</span>
      <div class="seg-ctl" role="group" aria-label="View"><button data-omode="board" aria-pressed="${m === 'board'}">${ic('board')}Board</button><button data-omode="list" aria-pressed="${m === 'list'}">${ic('list')}List</button></div></div>

    ${m === 'board' ? boardHtml(items) : listHtml(items)}</div>`;

async function open(id, live) {
  const { S, API, esc, openPanel, openOrder, ic } = A();
  const isLive = live === undefined ? A().boardItems().some((x) => x.id === id) : live;
  if (isLive) {
    openOrder(id);
    try {
      const act = (await API.activity(id)).activity || [];
      if (act.length && S.panel && S.panel.id === id) {
        S.panel.html += `<section><div class="day-h">Activity</div><ol class="timeline">${act.map((a) => `<li><b>${esc(a.text)}</b><small>${esc(a.who)} · ${esc(new Date(a.at).toLocaleString('en-GB', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }))}</small></li>`).join('')}</ol></section>`;
        A().render();
      }
    } catch (e) { /* timeline is optional */ }
    return;
  }
  const it = histItems().find((x) => x.id === id) || { id, key: id, title: id };
  const d = await API.orderDetail(S.buyerId, id);
  const lines = d.lines || [];
  openPanel('history', `${it.key} · ${it.title}`, `<div class="stepper">${STATUSES.map(() => '<i class="on"></i>').join('')}</div>
    <div class="acts"><span class="pill done">Done</span>${it.eventColor ? label(it) : ''}<span class="pill ${it.onTime ? 'ordered' : 'waiting'}">${it.onTime ? 'On time' : 'Late'}</span></div>
    <dl class="kv"><dt>Delivered</dt><dd>${esc(dl(it.due))}</dd><dt>Kitchen</dt><dd>${esc(it.site || '')}</dd><dt>Total</dt><dd class="num">${esc(it.totalLabel || '')}</dd><dt>How it went</dt><dd>${esc(it.outcome || '')}</dd></dl>
    <section><div class="day-h">${lines.length} products</div>${lines.map((l) => `<div class="item"><span>${esc(l.product)}<span class="src">${esc(l.outcome)}</span></span><b class="num">${esc(String(l.qty))} ${esc(l.unit)} · ${eur(l.value)}</b></div>`).join('') || '<p class="muted">Details are available in the full app.</p>'}</section>
    <div class="acts"><button class="btn" data-go="insights">${ic('insights')} See trends in Insights</button></div>`, id);
}

async function click(t, d) {
  if (d.omode) { O.mode = d.omode; A().store.set('ordersMode', O.mode); A().renderView(); return true; }
  if (d.oquick) { O.quick[d.oquick] = !O.quick[d.oquick]; A().renderView(); return true; }
  if (d.oevent !== undefined) { O.event = d.oevent || null; A().renderView(); return true; }
  if (d.osort) { O.dir = O.sort === d.osort && O.dir === 'desc' ? 'asc' : 'desc'; O.sort = d.osort === 'key' ? 'date' : d.osort; O.page = 1; await load(); return true; }
  if (d.opage) { O.page = Math.max(1, O.page + +d.opage); await load(); return true; }
  if (d.open) { await open(d.open, d.live === '1'); return true; }
  return false;
}

let qTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'o-q') { O.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(async () => { O.page = 1; await load(); const el = document.getElementById('o-q'); if (el) { el.focus(); el.setSelectionRange(O.q.length, O.q.length); } }, 250); }
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'o-site') { O.site = e.target.value; O.page = 1; await load(); }
  if (e.target.id === 'o-group') { O.group = e.target.value; A().renderView(); }
});
document.addEventListener('keydown', (e) => {
  const tr = e.target.closest && e.target.closest('tr[data-open]');

});
document.addEventListener('click', (e) => {
  const tr = e.target.closest && e.target.closest('tr[data-open]');
  if (tr) open(tr.dataset.open, tr.dataset.live === '1');
});

window.AimoOrders = { view, load, reset, click, open };

function vegaConfig() {

function draw(el, spec) {
  if (!el || !spec) return;
  if (spec.type === 'table' || !window.vegaEmbed) { el.innerHTML = table(spec); return; }

  s.config = Object.assign(vegaConfig(), s.config || {});
  s.autosize = { type: 'fit-x', contains: 'padding' };
  window.vegaEmbed(el, s, { actions: false, renderer: 'svg' }).catch(() => { el.innerHTML = table(spec); });

  return `<div class="tbl-wrap"><table class="tbl compact"><thead><tr>${cols.map((c) => `<th scope="col">${esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.slice(0, 200).map((r) => `<tr>${cols.map((c) => `<td class="${typeof r[c.name] === 'number' ? 'num r' : ''}">${f(r[c.name])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  const sim = (a, b) => { const A = words(a), B = words(b); let x = 0; A.forEach((w) => B.has(w) && x++); return x / Math.max(1, Math.min(A.size, B.size)); };
  const now = () => new Date().toISOString();
  function pub(c) { return { id: c.id, buyerId: c.buyerId, title: c.title, thread: c.thread, sessionIds: [c.id] }; }
  function step(c, match) {
    const ok = c.cands.filter((i) => { const st = R.scripts[i].steps[c.cursor]; return st && match(st); });
    if (!ok.length) return null;
    c.cands = ok;
    const st = R.scripts[ok[0]].steps[c.cursor++];
    c.board = st.board; c.title = st.title;
    const cards = JSON.parse(JSON.stringify(st.cards)).map((k) => Object.assign(k, { sessionId: c.id }));
    c.thread.push({ role: 'assistant', cards, at: now() });
    return cards;
  }
  function offScript(c, text) {
    const ideas = (KITCHENS[c.buyerId] || KITCHENS['BUY-POHJOLA']).ideas;
    const card = { id: 'demo-' + (n++), type: 'question', title: 'Try one of these', text: 'This preview plays real gateway runs. Pick an example to see it.',
      chips: [], numbers: [], options: ideas.map(([t, sub], i) => ({ id: 'ex' + i, label: t.length > 60 ? t.slice(0, 58) + '…' : t, sub, send: t })),
      actions: [], why: ['Run the app locally (make run) to try your own words.'], items: [], sessionId: c.id };
    c.thread.push({ role: 'assistant', cards: [card], at: now() });
    return [card];
  }
  return {
    available: () => R.scripts.length > 0,
    data: R,
    async chat(cid, text, buyerId) {
      let c = convs[cid];
      if (!c || c.cursor >= R.scripts[c.cands[0]].steps.length || R.scripts[c.cands[0]].steps[c.cursor].kind !== 'say') {
        const scored = R.scripts.map((s, i) => [i, s.buyerId === buyerId && !s.id.startsWith('gala-next') || (s.id === 'gala-next' && /150|12\.12/.test(text)) ? sim(text, s.steps[0].text) : 0]);
        const best = Math.max(...scored.map((x) => x[1]));
        c = { id: 'CHAT-R' + (n++), buyerId, title: 'New chat', thread: [], cands: scored.filter((x) => x[1] === best && best >= 0.45).map((x) => x[0]), cursor: 0, board: null };
        convs[c.id] = c;
      }
      c.thread.push({ role: 'user', text, at: now() });
      const cards = c.cands.length ? step(c, (st) => st.kind === 'say') : offScript(c, text);
      if (c.title === 'New chat') c.title = text.slice(0, 40);
      return { conversation: pub(c), cards: cards || offScript(c, text) };
    },
    async action(cid, action, payload) {
      const c = convs[cid];
      const key = payload && (payload.productId || (payload.value != null ? String(payload.value) : null));
      const cards = step(c, (st) => st.kind === 'act' && st.action === action && (!st.key || !key || st.key === key)) || [];
      return { conversation: pub(c), cards };
    },
    async approve(sid, cid) { return Replay.action(cid, 'approve', {}); },
    async chats(bid) { return { chats: Object.values(convs).filter((c) => c.buyerId === bid).reverse().map((c) => ({ id: c.id, title: c.title })) }; },
    async chatGet(cid) { return pub(convs[cid]); },
    async board(bid) {
      const cols = ['planning', 'waiting', 'ordered', 'delivered', 'done'].map((id) => ({ id, label: { planning: 'Planning', waiting: 'Waiting for OK', ordered: 'Ordered', delivered: 'Delivered', done: 'Done' }[id], items: [] }));
      for (const c of Object.values(convs)) {
        if (c.buyerId !== bid || !c.board) continue;
        for (const col of c.board.columns) for (const it of col.items) cols.find((x) => x.id === col.id).items.push(Object.assign({}, it, { conversationId: c.id, id: c.id }));
      }
      return { columns: cols, count: cols.reduce((a, x) => a + x.items.length, 0) };
    },
    async insights(bid) { return R.insights[bid] || { statements: [], chart: { values: [] }, tips: [] }; },
    async settings(bid) { return R.settings[bid]; },
    async playbook() { return R.playbook; },
    async history(bid, p) {
      let rows = ((R.extra || {}).history || {})[bid] || [];
      if (p.q) { const q = p.q.toLowerCase(); rows = rows.filter((o) => [o.event, o.site, o.key].some((x) => String(x || '').toLowerCase().includes(q))); }
      if (p.siteId) rows = rows.filter((o) => o.siteId === p.siteId);
      const page = +p.page || 1, size = +p.size || 50;
      return { orders: rows.slice((page - 1) * size, page * size), total: rows.length, page, size };
    },
    async orderDetail(bid, id) { return (((R.extra || {}).details || {})[bid] || {})[id] || { id, lines: [] }; },
    async activity() { return { activity: [] }; },
    async wrapped(bid, site) { return ((R.extra || {}).wrapped || {})[bid + '|' + (site || '')] || { cards: [] }; },
    async kitchens(bid) { return ((R.extra || {}).kitchens || {})[bid]; },
    async ask(bid, prompt) {
      const asks = ((R.extra || {}).asks || {})[bid] || [];
      const scored = asks.map((a) => [a, sim(prompt, a.prompt)]).sort((x, y) => y[1] - x[1]);
      if (scored.length && scored[0][1] >= 0.5) return scored[0][0].answer;
      return { offline: true, examples: asks.map((a) => a.prompt) };
    },
    async seed() {
      const r = await Replay.chat(null, GALA, 'BUY-POHJOLA');
      await Replay.action(r.conversation.id, 'order', {});
      return r.conversation.id;
    },
  };
})();

let API = Live;

const conv = () => S.convs[S.convId];

// ------------------------------------------------------------------ chat
function chatView() {
  const c = conv();
  if (!c || !c.thread.length) {
    const k = KITCHENS[S.buyerId];
    return `<div class="wrap"><div class="empty"><h1>Hi ${esc(k.person.split(' ')[0])}, what do you need?</h1>
      <p>Tell me an event or an order in your own words. I start from your favourites and what worked last time.</p>
      <div class="ideas">${k.ideas.map(([t, sub]) => `<button class="idea" data-send="${esc(t)}">${ic('chat')}<span>${esc(t)}<small>${esc(sub)}</small></span></button>`).join('')}</div></div></div>`;
  }
  // one-time actions on cards from earlier turns are spent; viewing actions stay
  const lastAsst = c.thread.map((m, i) => (m.role === 'assistant' ? i : -1)).reduce((a, b) => Math.max(a, b), -1);
  const html = c.thread.map((m, i) => (m.role === 'user'
    ? `<div class="msg-user">${esc(m.text)}</div>`

  return `<div class="wrap"><div class="thread">${html}${S.busy ? `<div class="typing" role="status"><i></i>${esc(S.busyLabel || 'Working on it')}</div>` : ''}</div></div>`;
}

const VIEW_ACTIONS = new Set(['see_items', 'track']);
function cardHtml(k, past) {
  let done = S.uiDone[k.id];
  if (past && !done && (k.options || []).length) done = { label: '' };
  const nums = k.numbers && k.numbers.length ? `<div class="nums num">${k.numbers.map((n) => `<div><b>${esc(n.value)}</b><span>${esc(n.label)}</span></div>`).join('')}</div>` : '';
  const chips = k.chips && k.chips.length ? `<div class="chips">${k.chips.map((c) => `<span class="chip ${c.status}" ${c.status === 'assumed' ? 'title="My guess"' : ''}>${esc(c.label)}</span>`).join('')}</div>` : '';
  let opts = '';
  if (k.options && k.options.length) {
    opts = `<div class="opts">${k.options.map((o, i) => `<button class="opt ${done && done.pick === o.id ? 'picked' : ''}" data-card="${k.id}" data-opt="${i}" ${done ? 'disabled' : ''}>
      <b>${esc(o.label)}</b>${o.tag ? `<span class="tag">${esc(o.tag)}</span>` : '<span></span>'}${o.sub || o.why ? `<small>${esc([o.sub, o.why].filter(Boolean).join(' · '))}</small>` : ''}</button>`).join('')}</div>`;
  }
  let usage = '';
  if (k.type === 'how_did_it_go') {
    const sel = S.usage[k.id] || {};
    usage = `<div class="usage">${k.items.map((r) => `<div class="urow"><span>${esc(r.label)}</span><span class="seg" role="group" aria-label="${esc(r.label)}">${r.choices.map((ch) => `<button data-usage="${k.id}" data-need="${esc(r.need)}" data-val="${ch.id}" aria-pressed="${(sel[r.need] || 'all') === ch.id}" ${done ? 'disabled' : ''}>${esc(ch.label)}</button>`).join('')}</span></div>`).join('')}</div>`;
  }
  let acts = '';
  if (done && done.label) acts = `<span class="done-note">${ic('check')} ${esc(done.label)}</span>`;
  else if (done) acts = '';
  else acts = (k.actions || []).filter((a) => !past || VIEW_ACTIONS.has(a.id)).map((a, i) => `<button class="btn ${a.primary ? 'primary' : ''}" data-card="${k.id}" data-act="${i}">${esc(a.label)}</button>`).join('');
  const why = k.why && k.why.filter(Boolean).length ? `<button class="why-link" data-why="${k.id}" aria-expanded="${!!S.uiDone['why:' + k.id]}">Why?</button>` : '';
  const whyList = S.uiDone['why:' + k.id] ? `<ul class="why">${k.why.filter(Boolean).map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : '';
  return `<article class="card" data-type="${k.type}" id="c-${k.id}">
    <div class="card-h"><span class="ic">${ic(CARD_ICON[k.type] || 'chat')}</span>${esc(k.title)}</div>
    ${k.text ? `<div class="card-t">${esc(k.text)}</div>` : ''}${nums}${chips}${opts}${usage}
    ${acts || why ? `<div class="acts">${acts}${why}</div>` : ''}${whyList}</article>`;
}

function findCard(id) { return allCards().find((c) => c.id === id); }

async function send(text) {
  text = text.trim();
  if (!text || S.busy) return;
  const c = conv();
  if (c) c.thread.push({ role: 'user', text });
  else { S.pending = { id: 'tmp', thread: [{ role: 'user', text }], title: text.slice(0, 40) }; S.convs.tmp = S.pending; S.convId = 'tmp'; }
  await run(() => API.chat(c ? c.id : null, text, S.buyerId), ['Reading your request', 'Checking your favourites', 'Building the basket', 'Checking your rules']);
}

async function run(fn, labels) {
  S.busy = true; S.busyLabel = labels[0]; renderView();
  let li = 0; const timer = setInterval(() => { li = Math.min(li + 1, labels.length - 1); S.busyLabel = labels[li]; const t = $('.typing'); if (t) t.lastChild.textContent = S.busyLabel; }, 450);
  try {
    const r = await fn();
    applyConv(r.conversation);
  } catch (e) {
    toast(e.message || 'Could not reach the kitchen assistant.');
    if (conv() && conv().id === 'tmp') { delete S.convs.tmp; S.convId = null; }
  } finally {
    clearInterval(timer); S.busy = false;
    await refresh();
  }
}

function applyConv(c) {
  if (!c) return;
  delete S.convs.tmp;
  S.convs[c.id] = c; S.convId = c.id;
  store.set('conv', c.id);
}

async function refresh() {
  try {
    const [ch, b] = await Promise.all([API.chats(S.buyerId), API.board(S.buyerId)]);
    S.chats = ch.chats; S.board = b;
  } catch (e) { /* offline */ }
  render();
  if (S.panel && S.panel.kind === 'order') openOrder(S.panel.id, true);
}

async function onCardAction(cardId, idx) {
  const k = findCard(cardId); const a = k.actions[idx];
  const id = a.id;
  if (id === 'ack') { S.uiDone[cardId] = { label: a.label }; return renderView(); }
  if (id === 'change') { S.uiDone[cardId] = { label: 'Tell me what to change below' }; render(); const m = $('#msg'); m.placeholder = 'e.g. now 200 guests, or a different date'; m.focus(); return; }
  if (id === 'see_items') return openItems(k);
  if (id === 'track') { const it = boardItems().find((x) => x.order && x.order.orderId === (a.payload || {}).orderId) || boardItems().find((x) => x.conversationId === S.convId); return it ? openOrder(it.id) : null; }
  if (id === 'not_now') { S.uiDone[cardId] = { label: 'Kept in Planning' }; return renderView(); }
  const payload = Object.assign({}, a.payload || {}, { sessionId: k.sessionId });
  if (id === 'save_usage') payload.entries = S.usage[cardId] || {};
  const labels = { order: 'Placing the order', send_for_ok: 'Sending for OK', apply_tip: 'Changing the amounts', ignore_tip: 'Noted', use_alternative: 'Checking the safe choice', save_usage: 'Saving' };
  S.uiDone[cardId] = { label: { order: 'Ordered', send_for_ok: 'Sent for OK', apply_tip: 'Applied', ignore_tip: 'Ignored', use_alternative: 'Using the safe choice', save_usage: 'Saved' }[id] || a.label };
  await run(() => API.action(S.convId, id, payload), [labels[id] || 'Working on it', 'Checking your rules']);
}

async function onOption(cardId, i) {
  const k = findCard(cardId); const o = k.options[i];
  if (o.send) return send(o.send);
  if (k.type === 'question') {
    S.uiDone[cardId] = { label: o.label, pick: o.id };
    return run(() => API.action(S.convId, 'answer', { field: o.field, value: o.value, sessionId: k.sessionId }), ['Got it', 'Checking your favourites', 'Building the basket']);
  }
  if (k.type === 'choice') {
    S.uiDone[cardId] = { label: 'Picked', pick: o.id };
    return run(() => API.action(S.convId, 'pick', Object.assign({ sessionId: k.sessionId }, o.payload)), ['Locking the price', 'Checking your rules']);
  }
}

// ------------------------------------------------------------------ panel
function openPanel(kind, title, html, id) { S.panel = { kind, title, html, id }; S.lastFocus = document.activeElement; render(); const b = $('.panel [data-close]'); if (b) b.focus(); }
function closePanel() { S.panel = null; render(); if (S.lastFocus && document.body.contains(S.lastFocus)) S.lastFocus.focus(); }
const SRC = { favourites: 'Favourite', similar_orders: 'Worked last time', discover: 'New', learned_quantities: 'Learned', leftovers: 'In stock' };
function itemsHtml(groups) {
  return groups.map((g) => `<section><div class="day-h">${esc(g.day)}</div>${g.lines.map((l) => `<div class="item"><span>${esc(l.name)}${l.source ? `<span class="src">${SRC[l.source] || ''}</span>` : ''}</span><b class="num">${esc(l.qty || '')}${l.price ? ' · ' + esc(l.price) : ''}</b>${l.why ? `<small>${esc(l.why)}</small>` : ''}</div>`).join('')}</section>`).join('');
}
function openItems(k) { openPanel('items', k.title, itemsHtml(k.items || []) + (k.why && k.why.length ? `<ul class="why">${k.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : '')); }
const boardItems = () => (S.board ? S.board.columns.flatMap((c) => c.items) : []);
function openOrder(id, quiet) {
  const it = boardItems().find((x) => x.id === id);
  if (!it) { if (quiet) { S.panel = null; render(); } return; }
  const order = ['planning', 'waiting', 'ordered', 'delivered', 'done'];
  const pos = order.indexOf(it.status);
  let acts = '';
  if (it.status === 'waiting') acts = `<p class="muted" style="margin:0">Demo: you are now ${esc(it.approval ? it.approval.approver.name : 'the approver')}.</p><div class="acts"><button class="btn primary" data-approve="${it.id}" data-conv="${it.conversationId}">OK, order it</button><button class="btn" data-decline="${it.id}" data-conv="${it.conversationId}">Not now</button></div>`;
  if (it.status === 'ordered') acts = `<div class="acts"><button class="btn" data-delivered="${it.conversationId}">Mark as delivered (demo)</button></div>`;
  if (it.status === 'delivered') acts = `<div class="acts"><button class="btn primary" data-openchat="${it.conversationId}">Tell me how it went</button></div>`;
  const html = `<div class="stepper" aria-label="${esc(it.statusLabel)}">${order.map((s, i) => `<i class="${i <= pos ? 'on' : ''}"></i>`).join('')}</div>
    <div><span class="pill ${it.status}">${esc(it.statusLabel)}</span></div>
    <dl class="kv"><dt>What</dt><dd>${esc(it.subtitle)}</dd>${it.totalLabel ? `<dt>Total</dt><dd class="num">${esc(it.totalLabel)}</dd>` : ''}
    ${(it.deliveries || []).map((d) => `<dt>Delivery</dt><dd>${esc(d.label)} ${esc(d.window)}</dd>`).join('')}</dl>
    ${acts}${itemsHtml(it.items || [])}
    <div class="acts"><button class="btn text" data-openchat="${it.conversationId}">Open the chat</button></div>`;
  if (quiet) { S.panel = { kind: 'order', title: it.title, html, id }; render(); } else openPanel('order', it.title, html, id);
}

// ------------------------------------------------------------------ insights
async function loadInsights() {
  const d = await API.insights(S.buyerId);
  const ch = d.chart || { values: [] };
  let chart = '';
  if (ch.values && ch.values.length) {
    const W = 640, H = 200, L = 36, Rr = 14, T = 14, B = 30, max = 12;
    const x = (i) => L + i * (W - L - Rr) / (ch.values.length - 1);
    const y = (v) => T + (1 - v / max) * (H - T - B);
    const pts = ch.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const last = ch.values.length - 1;
    chart = `<div class="chart"><h2>${esc(ch.title)}, share of food ordered</h2>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ch.title)} fell from ${ch.values[0]}% to ${ch.values[last]}%">
      ${[0, 4, 8, 12].map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--outline)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`).join('')}
      <polygon points="${x(0)},${y(0)} ${pts} ${x(last)},${y(0)}" fill="var(--primary-soft)" opacity=".7"/>
      <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last)}" cy="${y(ch.values[last])}" r="5" fill="var(--primary)"/>
      <text x="${x(last) - 8}" y="${y(ch.values[last]) - 12}" text-anchor="end" style="fill:var(--fg);font-weight:700">${ch.values[last]}%</text>
      ${ch.labels.map((l, i) => (i % 2 === 1 || i === last ? `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === last ? 'end' : 'middle'}">${i === last ? 'This week' : 'w/c ' + esc(l)}</text>` : '')).join('')}
      </svg></div>`;
  }
  S.insightsHtml = `<div class="wrap"><div class="page-h"><h1>Insights</h1><span class="muted">${esc(KITCHENS[S.buyerId].name)}</span></div>
    <div class="statements">${d.statements.map((s) => `<div class="statement ${s.tone}"><b>${esc(s.text)}</b>${s.detail ? `<span>${esc(s.detail)}</span>` : ''}</div>`).join('')}</div>
    ${chart}
    ${d.tips && d.tips.length ? `<div class="section"><h2>Tips</h2><div class="statements">${d.tips.map((t, i) => `<article class="card" data-type="tip"><div class="card-h"><span class="ic">${ic('tip')}</span>Tip</div><div class="card-t">${esc(t.text)}</div>${t.tipId ? `<div class="acts">${S.tips[t.tipId] ? `<span class="done-note">${ic('check')} ${esc(S.tips[t.tipId])}</span>` : `<button class="btn primary" data-tip="${t.tipId}" data-v="Will apply next time">Apply</button><button class="btn" data-tip="${t.tipId}" data-v="Ignored">Ignore</button>`}</div>` : ''}</article>`).join('')}</div></div>` : ''}</div>`;
  if (S.view === 'insights') renderView();
}

// ------------------------------------------------------------------ settings / more
async function loadSettings() {
  const [d, pb] = await Promise.all([API.settings(S.buyerId), S.playbook ? Promise.resolve(S.playbook) : API.playbook()]);
  S.playbook = pb;
  const theme = store.get('theme', 'system');
  const eur = (v) => (v == null ? '—' : '€' + Number(v).toLocaleString('en-US'));
  S.settingsHtml = `<div class="wrap"><div class="page-h"><h1>Settings</h1></div>
    <div class="section"><h2>Recent chats</h2><div class="list" id="m-recent">${S.chats.slice(0, 5).map((c) => `<button class="li" data-chat="${c.id}"><span>${esc(c.title)}</span></button>`).join('') || '<div class="li muted">No chats yet</div>'}</div></div>
    <div class="section"><h2>Kitchen</h2><div class="list">${Object.entries(KITCHENS).map(([id, k]) => `<button class="li" data-buyer="${id}"><span class="radio ${id === S.buyerId ? 'on' : ''}"></span><span>${esc(k.name)}<small>${esc(k.person)} · ${esc(k.role)}</small></span></button>`).join('')}</div></div>
    <div class="section"><h2>Favourites</h2><div class="list">${d.favourites.map((f) => `<div class="li"><span>${esc(f.name)}</span>${f.pinned ? '<small>Always first</small>' : ''}</div>`).join('') || '<div class="li"><span>None yet<small>I remember what you pick, so this fills up by itself.</small></span></div>'}</div></div>
    <div class="section"><h2>Spending limits</h2><div class="list">${d.limits.map((l) => `<div class="li"><span>${esc(l.label)}</span><b class="num">${eur(l.value)}</b></div>`).join('')}</div></div>
    <div class="section"><h2>Never order</h2><div class="list"><div class="li"><span>${d.allergens.length ? d.allergens.map(esc).join(', ') : 'Nothing blocked'}<small>Products that contain or may contain these are never ordered.</small></span></div></div></div>
    <div class="section"><h2>People who OK orders</h2><div class="list">${d.approvers.map((a) => `<div class="li"><span>${esc(a.name)}<small>${esc(a.role)}</small></span></div>`).join('')}</div></div>
    <div class="section"><h2>Appearance</h2><div class="seg-wide">${['system', 'light', 'dark'].map((t) => `<button class="btn ${theme === t ? 'primary' : ''}" data-theme-set="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>
    <div class="section"><h2>How it works</h2><div class="list steps">${(pb.steps || []).map((s) => `<div class="li"><span>${esc(s.name)}<small>${esc(s.does)}</small></span></div>`).join('')}</div>
      <p class="muted" style="font-size:14px">Every assistant follows these steps, version ${esc(pb.version || '')}. Prices: ${S.mode === 'live' ? (d.liveApi ? 'live from Valio Aimo' : 'demo prices until the Valio Aimo key is set') : 'recorded demo run'}.</p></div>
    ${S.mode === 'live' ? `<div class="section"><h2>Demo</h2><div class="acts"><button class="btn" data-reset>Start the demo again</button></div></div>` : ''}</div>`;
  if (S.view === 'settings') renderView();
}

function applyTheme() {
  const t = store.get('theme', 'system');
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}

// ------------------------------------------------------------------ voice (local app only)
let rec = null;
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Voice works in Chrome or Edge in the full app. Type here for now.');
  if (S.recording && rec) { rec.stop(); return; }
  try {
    rec = new SR(); rec.lang = /[äö]/.test(($('#msg') || {}).value || '') ? 'fi-FI' : 'en-GB'; rec.interimResults = true;
    rec.onresult = (e) => { const m = $('#msg'); m.value = Array.from(e.results).map((r) => r[0].transcript).join(' '); $('#send').disabled = !m.value.trim(); };
    rec.onend = () => { S.recording = false; const m = $('#msg') && $('#msg').value; render(); if (m) { $('#msg').value = m; $('#send').disabled = false; } };
    rec.onerror = () => toast('I could not hear you. Check the microphone permission.');
    rec.start(); S.recording = true; render();
  } catch (e) { toast('The microphone is not available here.'); }
}

// ------------------------------------------------------------------ events
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-close]');
  if (!t) return;
  const d = t.dataset;
  if ('close' in d) return closePanel();
  for (const m of [window.AimoOrders, window.AimoInsights, window.AimoKitchens]) if (m && await m.click(t, d)) return;
  if (d.go) {
    if (d.go === 'new') { S.convId = null; S.view = 'chat'; S.panel = null; return render(); }
    S.view = d.go; S.panel = null; render();
    if (d.go === 'insights') window.AimoInsights.load();
    if (d.go === 'settings') window.AimoKitchens.load();
    if (d.go === 'orders') { refresh(); window.AimoOrders.load(); }
    return;
  }
  if (d.chat) { if (!S.convs[d.chat]) applyConv(await API.chatGet(d.chat)); S.convId = d.chat; S.view = 'chat'; S.panel = null; return render(); }
  if (d.send) return send(d.send);
  if (d.act) return onCardAction(d.card, +d.act);
  if (d.opt) return onOption(d.card, +d.opt);
  if (d.why) { S.uiDone['why:' + d.why] = !S.uiDone['why:' + d.why]; return renderView(); }
  if (d.usage) { const m = S.usage[d.usage] = S.usage[d.usage] || {}; m[d.need] = d.val; return renderView(); }
  if (d.order) return window.AimoOrders.open(d.order);
  if (d.approve || d.decline) {
    const sid = d.approve || d.decline; const cid = d.conv;
    S.panel = null; S.view = 'chat'; S.convId = cid;
    if (d.decline) { toast('Kept in Planning'); return render(); }
    return run(() => API.approve(sid, cid, true).then((r) => r.conversation ? r : API.chatGet(cid).then((c) => ({ conversation: c }))), ['Placing the order']);
  }
  if (d.delivered) { S.panel = null; S.view = 'chat'; S.convId = d.delivered; return run(() => API.action(d.delivered, 'delivered', {}), ['Opening the check-in']); }
  if (d.openchat) { if (!S.convs[d.openchat]) applyConv(await API.chatGet(d.openchat)); S.convId = d.openchat; S.view = 'chat'; S.panel = null; return render(); }
  if (d.buyer) { S.buyerId = d.buyer; store.set('buyer', d.buyer); S.convId = null; S.panel = null; window.AimoOrders.reset(); window.AimoInsights.reset(); await refresh(); window.AimoKitchens.load(); return; }
  if (d.themeSet) { store.set('theme', d.themeSet); applyTheme(); renderView(); return; }
  if (d.tip) { S.tips[d.tip] = d.v; return loadInsights(); }
  if ('reset' in d) { await API.reset(); S.convs = {}; S.convId = null; S.uiDone = {}; await boot(); toast('Demo restarted'); return; }
  if (t.id === 'mic') return toggleMic();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'msg') { e.target.style.height = 'auto'; e.target.style.height = Math.min(160, e.target.scrollHeight) + 'px'; $('#send').disabled = !e.target.value.trim(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'msg' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(e.target.value); }
  if (e.key === 'Escape' && S.panel) closePanel();
});
document.addEventListener('submit', (e) => { if (e.target.id === 'composer') { e.preventDefault(); send($('#msg').value); } });

// ------------------------------------------------------------------ boot
window.AimoApp = { S, get API() { return API; }, esc, ic, ICONS, render, renderView, openPanel, closePanel, toast, store, KITCHENS,
  boardItems, applyConv, refresh, openOrder, itemsHtml, applyTheme };

async function boot() {
  applyTheme();
  S.buyerId = store.get('buyer', 'BUY-POHJOLA');
  if (!KITCHENS[S.buyerId]) S.buyerId = 'BUY-POHJOLA';
  let live = false;
  if (location.protocol.startsWith('http')) {
    try { const r = await fetch('/v1/playbook', { cache: 'no-store' }); live = r.ok && (r.headers.get('content-type') || '').includes('json'); } catch (e) { live = false; }
  }
  if (!live && Replay.available()) {
    API = Replay; S.mode = 'replay'; S.buyerId = 'BUY-POHJOLA';
    const cid = await Replay.seed();
    applyConv(await Replay.chatGet(cid));
  } else {
    API = Live; S.mode = 'live';
    const ch = await API.chats(S.buyerId);
    const last = store.get('conv', null);
    const pick = ch.chats.find((c) => c.id === last) || ch.chats[ch.chats.length - 1];
    if (pick) applyConv(await API.chatGet(pick.id));
  }
  await refresh();
}
boot();
})();
</script>
