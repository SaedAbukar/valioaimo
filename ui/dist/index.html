<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aimo Agent Gateway</title>
<meta name="description" content="Junction 2026 prototype for the Valio Aimo challenge: trusted agent purchasing. Synthetic data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Aimo Agent Gateway — minimal Material 3.
   Three colours: turquoise (primary), white (surface), sky blue (secondary / containers).
   Neutrals are tints of these. Status colours only as small text accents. */
:root {
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --primary: #087a85;            /* turquoise, 5.1:1 on white */
  --on-primary: #ffffff;
  --primary-container: #cdeff2;
  --on-primary-container: #00363b;
  --secondary: #2f7fa3;          /* sky blue, text-safe tone */
  --secondary-container: #dcf0fa;/* sky tint */
  --on-secondary-container: #0b3a4e;
  --sky: #87ceeb;

  --surface: #ffffff;
  --surface-1: #f4f9fa;          /* container low */
  --surface-2: #eaf4f6;          /* container */
  --surface-3: #ddedf0;          /* container high */
  --on-surface: #0f1e22;
  --on-surface-variant: #46595e;
  --outline: #6f8a90;
  --outline-variant: #d3e3e7;
  --scrim: rgb(15 30 34 / .32);
  --inverse-surface: #263538;
  --inverse-on-surface: #eaf4f6;
  --inverse-primary: #6fd3dc;

  --block: #b3261e;              /* muted red, text only */
  --approve: #8a5a00;            /* muted amber, text only */

  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 28px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #6fd3dc; --on-primary: #00363b; --primary-container: #0b4f56; --on-primary-container: #cdeff2;
    --secondary: #8fc9e3; --secondary-container: #22445a; --on-secondary-container: #d3ecf8; --sky: #8fc9e3;
    --surface: #0e1a1d; --surface-1: #142326; --surface-2: #18292d; --surface-3: #203438;
    --on-surface: #e1eef0; --on-surface-variant: #a9bfc4; --outline: #7c9499; --outline-variant: #2c4247;
    --scrim: rgb(0 0 0 / .5); --inverse-surface: #e1eef0; --inverse-on-surface: #18292d; --inverse-primary: #087a85;
    --block: #f2b8b5; --approve: #e6c27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: #6fd3dc; --on-primary: #00363b; --primary-container: #0b4f56; --on-primary-container: #cdeff2;
  --secondary: #8fc9e3; --secondary-container: #22445a; --on-secondary-container: #d3ecf8; --sky: #8fc9e3;
  --surface: #0e1a1d; --surface-1: #142326; --surface-2: #18292d; --surface-3: #203438;
  --on-surface: #e1eef0; --on-surface-variant: #a9bfc4; --outline: #7c9499; --outline-variant: #2c4247;
  --scrim: rgb(0 0 0 / .5); --inverse-surface: #e1eef0; --inverse-on-surface: #18292d; --inverse-primary: #087a85;
  --block: #f2b8b5; --approve: #e6c27a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface); color: var(--on-surface); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
a { color: var(--primary); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; line-height: 18px; word-break: break-all; }
.ms { width: 24px; height: 24px; fill: currentColor; flex: none; display: inline-block; }
.ms.s { width: 18px; height: 18px; }

/* type scale */
.display { font: 400 36px/44px var(--font); letter-spacing: -.25px; }
.headline { font: 400 24px/32px var(--font); }
.title-l { font: 400 22px/28px var(--font); }
.title { font: 500 16px/24px var(--font); letter-spacing: .15px; }
.title-s { font: 500 14px/20px var(--font); letter-spacing: .1px; }
.body-l { font: 400 16px/24px var(--font); }
.body { font: 400 14px/20px var(--font); }
.small { font: 400 12px/16px var(--font); letter-spacing: .2px; }
.label { font: 500 12px/16px var(--font); letter-spacing: .5px; }
.muted { color: var(--on-surface-variant); }
.t-block { color: var(--block); }
.t-approve { color: var(--approve); }
.t-ok { color: var(--primary); }

/* shell */
.app { display: grid; grid-template-columns: 80px minmax(0, 1fr); grid-template-rows: 64px minmax(0, 1fr); height: 100%; }
.topbar { grid-column: 2; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 24px; background: var(--surface); }
.topbar.lifted { background: var(--surface-2); }
.topbar h1 { flex: 1; min-width: 0; font: 400 22px/28px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail { grid-row: 1 / -1; grid-column: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; background: var(--surface); border-right: 1px solid var(--outline-variant); }
.rail .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; margin-bottom: 20px; }
.dest { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; padding: 0 0 4px; color: var(--on-surface-variant); text-decoration: none; position: relative; }
.dest .ind { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; position: relative; }
.dest:hover .ind { background: var(--surface-2); }
.dest.on { color: var(--on-surface); }
.dest.on .ind { background: var(--secondary-container); color: var(--on-secondary-container); }
.dest .lbl { font: 500 12px/16px var(--font); letter-spacing: .5px; }
.dest .dot { position: absolute; top: 2px; right: 12px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font: 500 11px/16px var(--font); text-align: center; }
main { grid-column: 2; overflow-y: auto; overflow-x: hidden; min-width: 0; }
.page { max-width: 760px; margin: 0 auto; padding: 8px 24px 96px; display: flex; flex-direction: column; gap: 24px; }
.page.wide { max-width: 1040px; }
.navbar { display: none; }

/* autopilot result: one column on phone, two panes on wide screens */
.result { display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 1100px) { .result { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; } }
/* surfaces */
.card { background: var(--surface-1); border-radius: var(--r-l); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.card.outlined { background: var(--surface); border: 1px solid var(--outline-variant); }
.section { display: flex; flex-direction: column; gap: 8px; }
.section > .label { color: var(--on-surface-variant); padding: 0 4px; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.divider { height: 1px; background: var(--outline-variant); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

/* buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 24px; border-radius: 20px; border: 0; background: transparent; color: var(--primary); font: 500 14px/20px var(--font); letter-spacing: .1px; cursor: pointer; text-decoration: none; white-space: nowrap; isolation: isolate; }
.btn::after, .iconbtn::after, .li::after, .chip::after, .seg button::after, .dest .ind::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity .15s; z-index: -1; pointer-events: none; }
.btn:hover::after, .iconbtn:hover::after, .chip:hover::after, .seg button:hover::after { opacity: .08; }
.btn:active::after, .iconbtn:active::after { opacity: .12; }
.btn .ms { width: 18px; height: 18px; margin-left: -8px; }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.outlined { border: 1px solid var(--outline); }
.btn.text { padding: 0 12px; }
.btn.block { width: 100%; min-height: 48px; }
.btn:disabled { opacity: .38; cursor: default; }
.iconbtn { position: relative; width: 48px; height: 48px; border-radius: 24px; border: 0; background: none; color: var(--on-surface-variant); display: inline-grid; place-items: center; cursor: pointer; flex: none; isolation: isolate; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 400 12px/16px var(--font); color: var(--on-surface-variant); }
.input { width: 100%; min-height: 48px; padding: 12px 16px; border: 1px solid var(--outline); border-radius: 4px; background: transparent; outline: none; }
.input:focus { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
textarea.input { resize: vertical; line-height: 24px; font-size: 16px; }
.prompt { position: relative; }
.prompt textarea { padding-right: 56px; min-height: 104px; border-radius: var(--r-m); }
.prompt .mic { position: absolute; right: 4px; bottom: 4px; }
.prompt .mic.on { color: var(--primary); background: var(--primary-container); }
.seg { display: inline-flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; max-width: 100%; }
.seg button { position: relative; min-height: 40px; padding: 0 16px; border: 0; background: none; cursor: pointer; font: 500 14px/20px var(--font); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; isolation: isolate; }
.seg button + button { border-left: 1px solid var(--outline); }
.seg button.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.seg button .ms { width: 18px; height: 18px; }
.scroll-x { overflow-x: auto; scrollbar-width: none; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--outline-variant); border-radius: 8px; background: none; color: var(--on-surface-variant); font: 500 14px/20px var(--font); cursor: pointer; white-space: nowrap; isolation: isolate; }
.chip.on { background: var(--secondary-container); border-color: transparent; color: var(--on-secondary-container); }
.chip .ms { width: 18px; height: 18px; margin-left: -4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { appearance: none; margin: 0; width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); border: 2px solid var(--outline); cursor: pointer; }
.switch input:checked { background: var(--primary); border-color: var(--primary); }
.switch::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transition: all .15s; pointer-events: none; }
.switch:has(input:checked)::after { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--on-primary); }
input[type=range] { width: 100%; accent-color: var(--primary); height: 32px; margin: 0; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper output { min-width: 48px; text-align: center; font: 500 16px/24px var(--font); font-variant-numeric: tabular-nums; }

/* 48dp touch targets for compact controls */
.chip::before, .btn::before, .seg button::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 48px; transform: translateY(-50%); }
/* lists */
.list { display: flex; flex-direction: column; background: var(--surface-1); border-radius: var(--r-l); overflow: hidden; }
.list.plain { background: none; border-radius: 0; }
.li { position: relative; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; background: none; text-align: left; width: 100%; color: inherit; cursor: pointer; text-decoration: none; isolation: isolate; }
.li:hover::after { opacity: .06; }
.li.static { cursor: default; } .li.static:hover::after { opacity: 0; }
.li + .li { border-top: 1px solid var(--outline-variant); }
.li .lead { color: var(--on-surface-variant); }
.li .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li .trail { display: flex; align-items: center; gap: 4px; color: var(--on-surface-variant); flex: none; text-align: right; }
.li .chev { color: var(--on-surface-variant); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; }
.kv dt { color: var(--on-surface-variant); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/16px var(--font); letter-spacing: .3px; color: var(--on-surface-variant); white-space: nowrap; }
.status .ms { width: 16px; height: 16px; }
.kv dd.big .status { font: 500 14px/20px var(--font); letter-spacing: .1px; }
.kv dd.big .status .ms { width: 18px; height: 18px; }
.status.ok { color: var(--primary); } .status.approve { color: var(--approve); } .status.block { color: var(--block); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); color: var(--on-surface-variant); font: 500 12px/16px var(--font); white-space: nowrap; }
.rule { font: 500 12px/16px var(--mono); color: var(--on-surface-variant); }

/* metrics & charts */
.kpi { background: var(--surface-1); border-radius: var(--r-l); padding: 16px; display: flex; flex-direction: column; gap: 4px; border: 0; text-align: left; color: inherit; cursor: pointer; }
.kpi .v { font: 400 28px/36px var(--font); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--primary); }
.bar i.s { background: var(--sky); }
.bar i.w { background: var(--outline); }
.chart { width: 100%; display: block; }

/* bottom sheet / dialog */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--surface-1); width: min(640px, 100%); max-height: 90%; border-radius: var(--r-xl) var(--r-xl) 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outline); opacity: .4; margin: 16px auto 0; flex: none; }
.sheet header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 24px; flex: none; }
.sheet header h2 { flex: 1; font: 400 22px/28px var(--font); }
.sheet .sbody { padding: 0 24px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.sheet footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 24px; flex: none; }
@media (min-width: 840px) { .scrim { align-items: center; } .sheet { border-radius: var(--r-xl); max-height: 84%; } .sheet .handle { display: none; } .sheet header { padding-top: 20px; } }
details.x > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 48px; }
details.x > summary::-webkit-details-marker { display: none; }
details.x > summary .ms { transition: transform .15s; color: var(--on-surface-variant); }
details.x[open] > summary .ms.chev { transform: rotate(90deg); }
.snack { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--inverse-surface); color: var(--inverse-on-surface); border-radius: 4px; padding: 14px 16px; display: flex; gap: 16px; align-items: center; max-width: min(560px, calc(100% - 32px)); box-shadow: 0 2px 6px rgb(0 0 0 / .2); }
.snack button { background: none; border: 0; color: var(--inverse-primary); font: 500 14px var(--font); cursor: pointer; min-height: 40px; }
.menu { position: fixed; z-index: 55; background: var(--surface-2); border-radius: 4px; padding: 8px 0; min-width: 240px; box-shadow: 0 2px 6px rgb(0 0 0 / .15); }
.menu button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; min-height: 48px; padding: 8px 16px; border: 0; background: none; text-align: left; cursor: pointer; }
.menu button:hover { background: var(--surface-3); }
.menu button.on { color: var(--primary); }

/* architecture & data model */
.lanes { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 12px; }

.lane { border: 1px solid var(--outline-variant); border-radius: var(--r-l); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.lane .li { min-height: 44px; border-radius: 8px; }
.lane .li + .li { border-top: 0; }
.lane .li.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.ent { border: 1px solid var(--outline-variant); background: none; color: var(--on-surface); border-radius: 6px; padding: 4px 8px; font: 400 12px/16px var(--mono); cursor: pointer; min-height: 32px; }
.ent.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.ent.hl { background: var(--secondary-container); border-color: transparent; color: var(--on-secondary-container); }
.svgwrap { overflow-x: auto; background: #fff; border-radius: var(--r-m); padding: 8px; }

.empty { padding: 48px 16px; text-align: center; color: var(--on-surface-variant); }
.hide { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* phone */
@media (max-width: 839px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 64px minmax(0, 1fr) 80px; }
  .rail { display: none; }
  .topbar { grid-column: 1; padding: 0 4px 0 16px; }
  main { grid-column: 1; }
  .navbar { display: flex; grid-row: 3; background: var(--surface-2); justify-content: space-around; padding-top: 12px; }
  .navbar .dest { flex: 1; width: auto; }
  .page { padding: 4px 16px 32px; gap: 20px; }
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .display { font-size: 28px; line-height: 36px; }
  .li label.body-l[for^=w-], .li label[for=mdl] { width: 128px !important; font-size: 14px; }
  .sheet .sbody, .sheet header, .sheet footer { padding-left: 16px; padding-right: 16px; }
  .snack { bottom: 96px; }
}
@media (max-width: 839px) { .lanes { grid-template-columns: 1fr; } .lane { flex-direction: row; flex-wrap: wrap; } .lane .label { width: 100%; } .lane .li, .lane .li + .li { width: auto; min-height: 40px; padding: 8px 12px; } }

</style>
</head>

document.addEventListener('keydown', e => { if (e.key === 'Tab' && $('#layer .sheet')) { const f = [...$('#layer .sheet').querySelectorAll('button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null); if (f.length) { const i = f.indexOf(document.activeElement); if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); } } } if (e.key === 'Escape') { document.querySelectorAll('.menu').forEach(m => m.remove()); if ($('.scrim')) closeSheet(); } if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'apText') ACT.plan(); });
